# Example only: create a relayq Secret (API_KEY and DATABASE_URL) separately.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: relayq
spec:
  replicas: 2
  selector:
    matchLabels: {app: relayq}
  template:
    metadata:
      labels: {app: relayq}
    spec:
      containers:
        - name: relayq
          image: relayq:local
          ports: [{containerPort: 8080}]
          envFrom: [{secretRef: {name: relayq}}]
          env:
            - {name: ALLOWED_HOSTS, value: your-webhook-host.example}
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: relayq
spec:
  selector: {app: relayq}
  ports: [{port: 8080, targetPort: 8080}]
